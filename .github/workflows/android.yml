name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Vosk model
        uses: actions/cache@v4
        with:
          path: models/vosk-model-small-ar-tn-0.1-linto.zip
          key: vosk-small-ar-tn-0.1-linto

      # Optional release signing: add repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS.
      - name: Release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > haitham-release.jks
          printf "storeFile=haitham-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs (model is verified by SHA-256 and bundled)
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/HaithamVoiceAssistant-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/HaithamVoiceAssistant-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HaithamVoiceAssistant-apks
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Haitham Voice Assistant (build ${{ github.run_number }})
          body: |
            نسخة مبنية تلقائياً من الفرع ${{ github.ref_name }}.
            ثبّت HaithamVoiceAssistant-release.apk على الهاتف. راجع README للتعليمات.
          files: dist/*.apk
          prerelease: true
